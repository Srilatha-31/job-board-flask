{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="card shadow border-0">

        <div class="card-body p-5">

            <h2 class="text-primary mb-4">

                Contact Us

            </h2>

            <form id="contactForm">

                <div class="mb-3">

                    <label class="form-label">

                        Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Message

                    </label>

                    <textarea
                        class="form-control"
                        rows="5"
                        id="message"
                        required></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Send Message

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
